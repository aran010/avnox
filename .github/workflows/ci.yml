name: CI / CD & Staging Verification

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    name: Typecheck, Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Production build verification
        run: npm run build
